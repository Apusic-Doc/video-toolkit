<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Video Toolkit</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 48 48'><defs><linearGradient id='g' x1='0%25' y1='0%25' x2='100%25' y2='100%25'><stop offset='0%25' style='stop-color:%236c5ce7'/><stop offset='100%25' style='stop-color:%2300d2a0'/></linearGradient></defs><rect x='2' y='10' width='32' height='28' rx='4' fill='url(%23g)'/><polygon points='34,16 46,22 46,26 34,32' fill='url(%23g)'/><circle cx='18' cy='24' r='7' fill='white' opacity='0.9'/></svg>">
<link rel="stylesheet" href="css/app.css">
<script src="https://unpkg.com/vue@3/dist/vue.global.prod.js"></script>
</head>
<body>
<div id="app">
  <!-- Topbar -->
  <nav class="topbar">
    <div class="brand">
      <div class="brand-logo">🎬</div>
      <span style="background:var(--gradient);-webkit-background-clip:text;-webkit-text-fill-color:transparent;font-weight:800">Video Toolkit</span>
    </div>
    <div class="topbar-actions">
      <button class="icon-btn" @click="refreshFeatures" title="Refresh">🔄</button>
      <button class="icon-btn" @click="toggleTheme" :title="themeBtn==='🌙'?'Light':'Dark'">{{ themeBtn }}</button>
    </div>
  </nav>

  <div class="app-container">
    <!-- Projects View -->
    <template v-if="!selectedFeature">
      <div class="page-header">
        <h1><span>Projects</span></h1>
        <p>Manage your video and slideshow projects</p>
      </div>

      <div class="project-grid">
        <div class="project-card project-card--add" @click="showCreate=true">
          <div class="plus">+</div>
          <div>New Project</div>
        </div>
        <div v-for="f in features" :key="f.name" class="project-card" @click="selectFeature(f.name)">
          <div class="icon">{{ f.type==='video' ? '📹' : '🖼️' }}</div>
          <h4>{{ f.name }}</h4>
          <div class="meta">
            <span class="badge" :class="f.type==='video'?'badge-b':'badge-g'">{{ f.type }}</span>
            <span v-if="f.has_recording" class="badge badge-o">recording</span>
            <span v-if="f.has_slides" class="badge badge-o">slides</span>
            <span v-if="f.has_final" class="badge badge-g">done ✅</span>
          </div>
        </div>
      </div>
    </template>

    <!-- Detail View -->
    <template v-else>
      <div class="page-header" style="display:flex;align-items:center;gap:12px">
        <button class="icon-btn" @click="selectedFeature=''" title="Back">←</button>
        <div>
          <h1 style="margin:0"><span>{{ selectedFeature }}</span></h1>
          <p style="margin-top:2px"><span :class="featureType==='video'?'badge badge-b':'badge badge-g'">{{ featureType }}</span></p>
        </div>
        <div style="margin-left:auto">
          <button class="btn btn-pri" @click="run('all')" :disabled="running">{{ running?'⏳ ...':'🚀 Generate' }}</button>
        </div>
      </div>

      <!-- Tabs -->
      <div class="tabs">
        <div class="tab" :class="{active:tab==='files'}" @click="tab='files'">📁 Files</div>
        <div class="tab" :class="{active:tab==='config'}" @click="tab='config'">⚙️ Config</div>
        <div class="tab" :class="{active:tab==='run'}" @click="tab='run'">⚡ Commands</div>
        <div class="tab" :class="{active:tab==='output'}" @click="tab='output'">📺 Output</div>
      </div>

      <!-- Files Tab -->
      <div v-show="tab==='files'" class="detail-grid">
        <div class="card" v-if="featureType==='video'">
          <div class="card-header"><h3>📹 Recording</h3></div>
          <div class="card-body">
            <div v-if="hasRecording" class="file-item">
              <span class="name">🎬 recording.mov</span>
              <span class="del" @click="delFile('recording.mov')">✕</span>
            </div>
            <label v-else class="upload-zone">
              <input type="file" accept="video/*" @change="uploadFile($event,'recording.mov')">
              <div class="icon">📹</div>
              <div>Drop or click to upload recording</div>
              <div class="hint">.mov .mp4 supported</div>
            </label>
          </div>
        </div>

        <div class="card" v-if="featureType==='slide'">
          <div class="card-header"><h3>🖼️ Slides</h3></div>
          <div class="card-body">
            <div v-for="(s,i) in slideFiles" :key="i" class="file-item">
              <span class="name">🖼️ {{ s }}</span>
              <span class="del" @click="delFile('slides/'+s)">✕</span>
            </div>
            <label class="upload-zone" style="padding:24px">
              <input type="file" accept="image/*" multiple @change="uploadSlide($event)">
              <div class="icon">🖼️</div>
              <div>Drop or click to upload images</div>
              <div class="hint">.png .jpg supported</div>
            </label>
          </div>
        </div>

        <div class="card" v-if="featureType==='slide'">
          <div class="card-header"><h3>📝 Narration</h3></div>
          <div class="card-body">
            <label class="form-label">narration.txt (one line per slide)</label>
            <textarea class="textarea" v-model="narrationText" placeholder="Line 1 → Slide 1&#10;Line 2 → Slide 2&#10;..."></textarea>
            <div class="card-footer" style="border:none;padding:12px 0 0">
              <button class="btn btn-pri btn-sm" @click="saveNarration">Save</button>
            </div>
          </div>
        </div>

        <div class="card detail-full" v-if="featureType==='slide'">
          <div class="card-header"><h3>🗂️ Slide Files</h3></div>
          <div class="card-body" style="max-height:200px;overflow-y:auto">
            <div v-if="!slideFiles.length" class="empty-state" style="padding:20px">
              <div style="font-size:1.5rem;margin-bottom:8px">📭</div>
              <div>No slide images yet</div>
            </div>
          </div>
        </div>
      </div>

      <!-- Config Tab -->
      <div v-show="tab==='config'" class="detail-grid">
        <div class="card detail-full">
          <div class="card-header">
            <h3>📄 meta.json</h3>
            <button class="btn btn-pri btn-sm" @click="saveMeta">Save</button>
          </div>
          <div class="card-body">
            <textarea class="textarea" v-model="metaText" style="min-height:300px;font-family:var(--mono);font-size:0.78rem" spellcheck="false"></textarea>
          </div>
        </div>
        <div class="card detail-full">
          <div class="card-header">
            <h3>⚙️ Global Config</h3>
            <button class="btn btn-pri btn-sm" @click="saveGlobalConfig">Save</button>
          </div>
          <div class="card-body">
            <div class="config-grid">
              <div class="config-item" v-for="(v,k) in globalConfig" :key="k">
                <span class="key">{{ k }}</span>
                <input class="input" v-model="globalConfig[k]" />
              </div>
            </div>
          </div>
        </div>
      </div>

      <!-- Commands Tab -->
      <div v-show="tab==='run'">
        <div class="card" style="margin-bottom:16px">
          <div class="card-header">
            <h3>⚡ Commands</h3>
            <div class="status-bar">
              <span class="status-dot" :class="{running,running,ready:taskStatus==='done'}"></span>
              {{ taskStatus || 'idle' }}
            </div>
          </div>
          <div class="card-body">
            <div class="btn-row" style="margin-bottom:12px">
              <button class="btn btn-pri" @click="run('all')" :disabled="running">🚀 Generate All</button>
              <button class="btn" @click="run('srt')" :disabled="running">🎙️ Extract</button>
              <button class="btn" @click="run('dub')" :disabled="running">🤖 Dub</button>
              <button class="btn" @click="run('mix')" :disabled="running">🎬 Compose</button>
            </div>
            <div class="btn-row">
              <button class="btn btn-sm" @click="run('slide')" :disabled="running">📸 Slide</button>
              <button class="btn btn-sm" @click="run('trans')" :disabled="running">🌐 Translate</button>
              <button class="btn btn-sm" @click="run('en')" :disabled="running">🇬🇧 English</button>
              <button class="btn btn-sm" @click="run('dub-en')" :disabled="running">en-Dub</button>
              <button class="btn btn-sm" @click="run('mix-en')" :disabled="running">en-Mix</button>
            </div>
          </div>
        </div>

        <div class="card">
          <div class="card-header"><h3>🖥️ Terminal Output</h3></div>
          <div class="card-body" style="padding:0">
            <div class="terminal" ref="term">
              <div v-if="!lines.length" class="empty-state" style="padding:40px">
                <div style="font-size:2rem;margin-bottom:8px">🖥️</div>
                <div>Select a command to start</div>
              </div>
              <div v-for="(l,i) in lines" :key="i" :class="l.class||''">{{ l.text }}</div>
            </div>
          </div>
        </div>
      </div>

      <!-- Output Tab -->
      <div v-show="tab==='output'">
        <div class="card">
          <div class="card-header"><h3>📺 final.mp4</h3></div>
          <div class="card-body" style="padding:8px">
            <video v-if="hasFinal" controls class="video-player" :src="'/api/files/'+selectedFeature+'/final.mp4'"></video>
            <div v-else class="empty-state">
              <div style="font-size:2.5rem;margin-bottom:8px">📭</div>
              <div>No output yet</div>
            </div>
          </div>
        </div>
      </div>
    </template>
  </div>

  <!-- Create Dialog -->
  <div class="overlay" v-if="showCreate" @click.self="showCreate=false">
    <div class="dialog">
      <h3>✨ New Project</h3>
      <div class="form-section">
        <label class="form-label">Name</label>
        <input class="input" v-model="newProject.name" placeholder="e.g. 01-intro" @keyup.enter="createProject" autofocus>
      </div>
      <div class="form-section">
        <label class="form-label">Type</label>
        <select class="select" v-model="newProject.mode">
          <option value="video">📹 Video (recording.mov)</option>
          <option value="slide">🖼️ Slideshow (images + narration)</option>
        </select>
      </div>
      <div class="btn-row" style="justify-content:flex-end;margin-top:24px">
        <button class="btn" @click="showCreate=false">Cancel</button>
        <button class="btn btn-pri" @click="createProject">Create Project</button>
      </div>
    </div>
  </div>
</div>

<script src="js/app.js"></script>
</body>
</html>
